
name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Extract Flutter ZIP quietly
      - name: Extract Flutter Source
        run: |
          sudo apt-get install -y -qq unzip

          ZIP_FILE="$GITHUB_WORKSPACE/Flutter-App-Full-SourceCode.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/zip_check"

          unzip -oq "$ZIP_FILE" -d "$RUNNER_TEMP/zip_check"

          if [ ! -f "$RUNNER_TEMP/zip_check/pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found at ZIP root!"
            exit 1
          fi

          unzip -oq "$ZIP_FILE" -d "$GITHUB_WORKSPACE"

          test -f "$GITHUB_WORKSPACE/pubspec.yaml"
          test -d "$GITHUB_WORKSPACE/lib"
          test -d "$GITHUB_WORKSPACE/android"

          echo "Flutter project extracted successfully."

      # 4. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 5. Verify environment
      - name: Verify Environment
        run: |
          java -version
          flutter --version
          cd android
          ./gradlew --version

      # 6. Install dependencies
      - name: Flutter Pub Get
        run: flutter pub get
        working-directory: ${{ github.workspace }}

      # 7. Build APK
      - name: Build Release APK
        run: flutter build apk --release
        working-directory: ${{ github.workspace }}

      # 8. Verify APK
      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated!"
            exit 1
          fi

          ls -lh "$APK"

      # 9. Upload Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
