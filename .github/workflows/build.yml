
name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Extract and detect project directory
      - name: Extract Flutter Source
        shell: bash
        run: |
          sudo apt-get install -y -qq unzip

          ZIP_FILE="$GITHUB_WORKSPACE/Flutter-App-Full-SourceCode.zip"
          EXTRACT_DIR="$RUNNER_TEMP/flutter_source"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          mkdir -p "$EXTRACT_DIR"
          unzip -oq "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "Searching for Flutter project..."

          PROJECT_DIR=""

          while IFS= read -r -d '' PUBSPEC; do
            CANDIDATE="$(dirname "$PUBSPEC")"

            if [ -f "$CANDIDATE/android/gradlew" ] && \
               [ -d "$CANDIDATE/lib" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(find "$EXTRACT_DIR" -type f -name pubspec.yaml -print0)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Complete Flutter project not found!"
            find "$EXTRACT_DIR" -maxdepth 5 -type f | head -150
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"
          echo "Project contents:"
          ls -lah "$PROJECT_DIR"
          echo "Android contents:"
          ls -lah "$PROJECT_DIR/android"

      # 4. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 5. Verify Environment
      - name: Verify Environment
        shell: bash
        run: |
          echo "Project: $PROJECT_DIR"
          echo "Java:"
          java -version

          echo "Flutter:"
          flutter --version

          cd "$PROJECT_DIR/android"

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew is missing!"
            exit 1
          fi

          chmod +x gradlew
          ./gradlew --version

      # 6. Install Dependencies
      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # 7. Build Release APK
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      # 8. Verify APK
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated!"
            find build -type f -name "*.apk" || true
            exit 1
          fi

          ls -lh "$APK"

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
