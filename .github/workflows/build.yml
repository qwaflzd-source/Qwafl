
name: Build Qawafil Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Flutter 3.35.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Extract Flutter project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -name "Flutter-App-Full-SourceCode.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Flutter-App-Full-SourceCode.zip not found."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/flutter_source"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/flutter_source"

          PROJECT_DIR=$(find "$RUNNER_TEMP/flutter_source" \
            -type f \
            -name pubspec.yaml \
            -not -path '*/.dart_tool/*' \
            -not -path '*/build/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Flutter project not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/android" ] || [ ! -d "$PROJECT_DIR/lib" ]; then
            echo "::error::Incomplete Flutter project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project located: $PROJECT_DIR"

      - name: Configure Android Gradle versions
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("settings.gradle")

          if not settings.exists():
              raise SystemExit("settings.gradle is missing.")

          text = settings.read_text()

          text, count = re.subn(
              r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])[^"\']+',
              r'\g<1>8.10.1',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit("Could not update Android Gradle Plugin version.")

          settings.write_text(text)

          wrapper = Path("gradle/wrapper")
          wrapper.mkdir(parents=True, exist_ok=True)

          properties = wrapper / "gradle-wrapper.properties"

          properties.write_text(
              "distributionBase=GRADLE_USER_HOME\n"
              "distributionPath=wrapper/dists\n"
              "zipStoreBase=GRADLE_USER_HOME\n"
              "zipStorePath=wrapper/dists\n"
              "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-all.zip\n"
          )

          print("AGP: 8.10.1")
          print("Gradle: 8.11.1")
          PY

      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/gradle-wrapper"
          cd "$RUNNER_TEMP/gradle-wrapper"

          gradle wrapper \
            --gradle-version 8.11.1 \
            --distribution-type all

          cp gradlew "$PROJECT_DIR/android/gradlew"

          cp -R gradle "$PROJECT_DIR/android/"

          chmod +x "$PROJECT_DIR/android/gradlew"

          cd "$PROJECT_DIR/android"

          ./gradlew --version

      - name: Match Firebase and Android package automatically
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          firebase = Path("android/app/google-services.json")
          gradle = Path("android/app/build.gradle")

          if not firebase.exists():
              raise SystemExit("google-services.json is missing.")

          if not gradle.exists():
              raise SystemExit("android/app/build.gradle is missing.")

          data = json.loads(firebase.read_text())

          clients = data.get("client", [])

          packages = []

          for client in clients:
              package = (
                  client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package and package not in packages:
                  packages.append(package)

          if not packages:
              raise SystemExit(
                  "No Android package found in Firebase configuration."
              )

          source = gradle.read_text()

          app_match = re.search(
              r'applicationId\s*=\s*["\']([^"\']+)["\']',
              source
          )

          namespace_match = re.search(
              r'namespace\s*=\s*["\']([^"\']+)["\']',
              source
          )

          old_id = app_match.group(1) if app_match else None

          if old_id in packages:
              selected = old_id
          else:
              selected = packages[0]

          if not app_match:
              raise SystemExit("applicationId declaration not found.")

          if not namespace_match:
              raise SystemExit("namespace declaration not found.")

          source = re.sub(
              r'(applicationId\s*=\s*)["\'][^"\']+["\']',
              lambda m: m.group(1) + '"' + selected + '"',
              source,
              count=1
          )

          source = re.sub(
              r'(namespace\s*=\s*)["\'][^"\']+["\']',
              lambda m: m.group(1) + '"' + selected + '"',
              source,
              count=1
          )

          gradle.write_text(source)

          print("Previous applicationId:", old_id)
          print("Firebase package IDs:", packages)
          print("Selected applicationId:", selected)
          print("Selected namespace:", selected)

          package_path = Path(*selected.split("."))

          target = (
              Path("android/app/src/main/kotlin")
              / package_path
          )

          target.mkdir(parents=True, exist_ok=True)

          source_dirs = [
              Path("android/app/src/main/kotlin"),
              Path("android/app/src/main/java")
          ]

          for source_dir in source_dirs:
              if source_dir.exists():
                  for old_file in source_dir.rglob("MainActivity.kt"):
                      old_file.unlink()

                  for old_file in source_dir.rglob("MainActivity.java"):
                      old_file.unlink()

          main_activity = target / "MainActivity.kt"

          main_activity.write_text(
              f"package {selected}\n\n"
              "import io.flutter.embedding.android.FlutterActivity\n\n"
              "class MainActivity : FlutterActivity()\n"
          )

          print("MainActivity configured:", main_activity)
          PY

      - name: Update incompatible dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub add flutter_downloader:^1.12.1

          flutter pub get

      - name: Fix Android plugin compatibility
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path.home() / ".pub-cache/hosted/pub.dev"

          if not root.exists():
              print("Pub cache not found; skipping compatibility patch.")
              raise SystemExit(0)

          for path in root.rglob("*.gradle"):
              try:
                  text = path.read_text()
              except Exception:
                  continue

              updated = text.replace(
                  "proguard-android.txt",
                  "proguard-android-optimize.txt"
              )

              if updated != text:
                  path.write_text(updated)

          print("ProGuard compatibility patch completed.")
          PY

      - name: Verify final Android configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          echo "===== Android app configuration ====="

          grep -nE 'namespace|applicationId|compileSdk|targetSdk' \
            app/build.gradle

          echo "===== MainActivity ====="

          find app/src/main -name MainActivity.kt -print

          echo "===== Firebase package ====="

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("app/google-services.json").read_text()
          )

          for client in data.get("client", []):
              print(
                  client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )
          PY

      - name: Flutter diagnostics
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter --version
          flutter doctor -v
          flutter pub get

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter clean
          flutter pub get

          flutter build apk \
            --debug \
            --verbose

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Qawafil-Debug-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
