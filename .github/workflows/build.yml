
name: Build Qawafil APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Flutter 3.35.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 4 -type f \
            -name 'Flutter-App-Full-SourceCode.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/flutter_source"

          unzip -q "$ZIP_FILE" \
            -d "$RUNNER_TEMP/flutter_source" \
            -x '*/.cxx/*' '*/.dart_tool/*' '*/build/*' '*/.gradle/*'

          PROJECT_DIR="$RUNNER_TEMP/flutter_source/Flutter-App-Full-SourceCode"

          test -f "$PROJECT_DIR/pubspec.yaml"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure Firebase package and MainActivity
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          firebase = Path("android/app/google-services.json")

          if not gradle.exists() or not firebase.exists():
              raise SystemExit("Android Gradle or Firebase configuration missing")

          data = json.loads(firebase.read_text(encoding="utf-8"))

          packages = [
              c.get("client_info", {})
               .get("android_client_info", {})
               .get("package_name")
              for c in data.get("client", [])
          ]

          packages = [p for p in packages if p]

          if not packages:
              raise SystemExit("No Android Firebase client found")

          package = (
              "com.qwafily.app"
              if "com.qwafily.app" in packages
              else packages[0]
          )

          if not re.fullmatch(
              r"[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)+",
              package
          ):
              raise SystemExit("Invalid Firebase package name")

          text = gradle.read_text(encoding="utf-8")

          text, n1 = re.subn(
              r'(?m)^(\s*namespace\s*=\s*)["\'][^"\']+["\']',
              lambda m: m.group(1) + f'"{package}"',
              text, count=1
          )

          text, n2 = re.subn(
              r'(?m)^(\s*applicationId\s*=\s*)["\'][^"\']+["\']',
              lambda m: m.group(1) + f'"{package}"',
              text, count=1
          )

          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not update namespace/applicationId")

          gradle.write_text(text, encoding="utf-8")

          src = Path("android/app/src/main")

          for p in src.rglob("*"):
              if p.is_file() and p.name in ("MainActivity.kt", "MainActivity.java"):
                  p.unlink()

          activity_dir = src / "kotlin" / package.replace(".", "/")
          activity_dir.mkdir(parents=True, exist_ok=True)

          (activity_dir / "MainActivity.kt").write_text(
              f"""package {package}

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          """,
              encoding="utf-8"
          )

          print("Configured package:", package)
          PY

      - name: Configure Android Gradle Plugin
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path("android/settings.gradle")
          if not p.exists():
              raise SystemExit("settings.gradle missing")

          s = p.read_text(encoding="utf-8")

          pattern = (
              r'(id\s+["\']com\.android\.application["\']'
              r'\s+version\s+["\'])[^"\']+(["\'])'
          )

          s, n = re.subn(pattern, r'\g<1>8.10.1\g<2>', s, count=1)

          if n != 1:
              raise SystemExit("Android application plugin declaration not found")

          p.write_text(s, encoding="utf-8")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
          FLUTTER_ROOT="$(dirname "$(dirname "$FLUTTER_BIN")")"

          mkdir -p android

          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "flutter.sdk=$FLUTTER_ROOT"
          } > android/local.properties

          cd android

          gradle wrapper \
            --gradle-version 8.11.1 \
            --distribution-type all

          chmod +x gradlew
          ./gradlew --version

      - name: Update Flutter downloader
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter pub add "flutter_downloader:^1.12.1"
          flutter pub get

      - name: Fix InAppWebView ProGuard reference
        shell: bash
        run: |
          set -euo pipefail

          PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"

          find "$PUB_CACHE" \
            -type f \
            -path '*flutter_inappwebview_android*' \
            -name '*.gradle' \
            -print0 |
          while IFS= read -r -d '' file; do
            sed -i \
              's/proguard-android\.txt/proguard-android-optimize.txt/g' \
              "$file"
          done

      - name: Clean and resolve dependencies
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter clean
          flutter pub get

      - name: Build ARM64 Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter build apk \
            --debug \
            --target-platform android-arm64 \
            --verbose

          APK="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/qawafil_output"
          cp "$APK" "$RUNNER_TEMP/qawafil_output/Qawafil-ARM64-Debug.apk"

          ls -lh "$RUNNER_TEMP/qawafil_output/Qawafil-ARM64-Debug.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$RUNNER_TEMP/qawafil_output/Qawafil-ARM64-Debug.apk"

          apksigner verify --verbose "$APK"

          aapt dump badging "$APK" | head -n 8

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qawafil-ARM64-Debug-APK
          path: ${{ runner.temp }}/qawafil_output/Qawafil-ARM64-Debug.apk
          if-no-files-found: error
          retention-days: 14
