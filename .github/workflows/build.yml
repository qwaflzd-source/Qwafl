
name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install unzip and extract ZIP directly
      - name: Extract Flutter Source
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          ZIP_FILE="$GITHUB_WORKSPACE/Flutter-App-Full-SourceCode.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE"

          echo "Project files:"
          ls -lah "$GITHUB_WORKSPACE"

          if [ ! -f "$GITHUB_WORKSPACE/pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found in project root!"
            exit 1
          fi

          if [ ! -d "$GITHUB_WORKSPACE/lib" ]; then
            echo "ERROR: lib directory not found!"
            exit 1
          fi

          if [ ! -d "$GITHUB_WORKSPACE/android" ]; then
            echo "ERROR: android directory not found!"
            exit 1
          fi

      # 3. Setup Flutter stable
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Check Flutter
      - name: Flutter Version
        run: flutter --version

      # 5. Install dependencies
      - name: Install Dependencies
        working-directory: ${{ github.workspace }}
        run: flutter pub get

      # 6. Build Release APK
      - name: Build Release APK
        working-directory: ${{ github.workspace }}
        run: flutter build apk --release

      # 7. Check APK
      - name: Verify APK
        run: |
          APK="$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK NOT FOUND!"
            find "$GITHUB_WORKSPACE/build" -name "*.apk" || true
            exit 1
          fi

          ls -lh "$APK"

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
