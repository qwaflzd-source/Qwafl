
name: Build Qawafil APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;33.0.2" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Locate and Extract Flutter Source
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"

          else
            ZIP_FILE=""

            if [ -f "Flutter-App-Full-SourceCode.zip" ]; then
              ZIP_FILE="Flutter-App-Full-SourceCode.zip"
            else
              ZIP_FILE="$(find . -maxdepth 5 -type f \
                -name 'Flutter-App-Full-SourceCode.zip' \
                -print -quit)"
            fi

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::Flutter project and source ZIP were not found"
              exit 1
            fi

            EXTRACT_DIR="$RUNNER_TEMP/flutter_source"
            mkdir -p "$EXTRACT_DIR"

            unzip -q "$ZIP_FILE" \
              -d "$EXTRACT_DIR" \
              -x '*/.cxx/*' '*/.dart_tool/*' '*/build/*' '*/.gradle/*'

            mapfile -t PROJECTS < <(
              find "$EXTRACT_DIR" \
                -type f \
                -name pubspec.yaml \
                -not -path '*/.dart_tool/*' \
                -not -path '*/build/*' \
                -not -path '*/.pub-cache/*' \
                -printf '%h\n'
            )

            if [ "${#PROJECTS[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one Flutter project, found ${#PROJECTS[@]}"
              printf '%s\n' "${PROJECTS[@]}"
              exit 1
            fi

            PROJECT_DIR="${PROJECTS[0]}"
          fi

          if [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "::error::pubspec.yaml not found"
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "::error::Android project directory not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/android/gradlew" ]; then
            echo "::error::Gradle wrapper not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project located:"
          echo "$PROJECT_DIR"

      - name: Verify Firebase Configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          FIREBASE_FILE="android/app/google-services.json"

          if [ ! -f "$FIREBASE_FILE" ]; then
            echo "::error::google-services.json not found"
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("android/app/google-services.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          packages = [
              c.get("client_info", {})
               .get("android_client_info", {})
               .get("package_name")
              for c in data.get("client", [])
          ]

          packages = [x for x in packages if x]

          if not packages:
              raise SystemExit("No Android package found in Firebase configuration")

          print("Firebase Android package(s):")
          for package in packages:
              print(" -", package)
          PY

      - name: Restore Existing Firebase Debug Keystore
        shell: bash
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${DEBUG_KEYSTORE_B64:-}" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 secret is missing"
            exit 1
          fi

          mkdir -p "$HOME/.android"

          echo "$DEBUG_KEYSTORE_B64" | base64 --decode \
            > "$HOME/.android/debug.keystore"

          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "::error::Debug keystore restoration failed"
            exit 1
          fi

          echo "Verifying restored debug keystore..."

          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            > "$RUNNER_TEMP/debug-keystore-info.txt"

          echo "Existing Debug Keystore restored successfully"

          grep -i "SHA1:" "$RUNNER_TEMP/debug-keystore-info.txt" || true

      - name: Clean and Resolve Dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter clean
          flutter pub get

      - name: Verify Android Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew --version

      - name: Build ARM64 Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter build apk \
            --debug \
            --target-platform android-arm64

          APK="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/qawafil_output"

          cp "$APK" \
            "$RUNNER_TEMP/qawafil_output/Qawafil-ARM64-Debug.apk"

          ls -lh "$RUNNER_TEMP/qawafil_output/Qawafil-ARM64-Debug.apk"

      - name: Verify APK Signing SHA-1
        shell: bash
        run: |
          set -euo pipefail

          APK="$RUNNER_TEMP/qawafil_output/Qawafil-ARM64-Debug.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi

          echo "Checking APK signature..."

          "$APKSIGNER" verify --print-certs "$APK" \
            | tee "$RUNNER_TEMP/apk-signature.txt"

          echo "Checking restored keystore fingerprint..."

          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | tee "$RUNNER_TEMP/keystore-signature.txt"

          APK_SHA1="$(grep -i 'SHA-1 digest:' "$RUNNER_TEMP/apk-signature.txt" \
            | head -n 1 | sed 's/.*SHA-1 digest: *//' | tr -d ':' | tr '[:lower:]' '[:upper:]')"

          KEY_SHA1="$(grep -i 'SHA1:' "$RUNNER_TEMP/keystore-signature.txt" \
            | head -n 1 | sed 's/.*SHA1: *//' | tr -d ':' | tr '[:lower:]' '[:upper:]')"

          if [ -z "$APK_SHA1" ] || [ -z "$KEY_SHA1" ]; then
            echo "::error::Could not read signing fingerprints"
            exit 1
          fi

          echo "APK SHA-1: $APK_SHA1"
          echo "KEY SHA-1: $KEY_SHA1"

          if [ "$APK_SHA1" != "$KEY_SHA1" ]; then
            echo "::error::APK fingerprint does not match restored Firebase debug keystore"
            exit 1
          fi

          echo "SHA-1 fingerprints match successfully"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qawafil-ARM64-Debug-APK
          path: ${{ runner.temp }}/qawafil_output/Qawafil-ARM64-Debug.apk
          if-no-files-found: error
          retention-days: 14
