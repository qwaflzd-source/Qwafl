
name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip

      - name: Extract Flutter project
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/flutter_source"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -name "Flutter-App-Full-SourceCode.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP file not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/flutter_source"

          PROJECT_DIR=$(find "$RUNNER_TEMP/flutter_source" -type f -name pubspec.yaml -printf '%h\n' | while read dir; do
            if [ -d "$dir/lib" ] && [ -d "$dir/android" ]; then
              echo "$dir"
              break
            fi
          done)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Flutter project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Java for Flutter
        run: flutter config --jdk-dir="$JAVA_HOME"

      - name: Create Gradle Wrapper 9.3.1
        shell: bash
        run: |
          set -e

          GRADLE_DIR="$RUNNER_TEMP/gradle_setup"
          mkdir -p "$GRADLE_DIR"

          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
            -o "$RUNNER_TEMP/gradle-9.3.1-bin.zip"

          unzip -q "$RUNNER_TEMP/gradle-9.3.1-bin.zip" -d "$GRADLE_DIR"

          mkdir -p "$RUNNER_TEMP/wrapper_project"
          cd "$RUNNER_TEMP/wrapper_project"

          echo "rootProject.name = 'wrapper_project'" > settings.gradle
          echo " " > build.gradle

          "$GRADLE_DIR/gradle-9.3.1/bin/gradle" wrapper \
            --gradle-version 9.3.1 \
            --distribution-type bin

          mkdir -p "$PROJECT_DIR/android/gradle/wrapper"

          cp gradlew "$PROJECT_DIR/android/"
          cp gradlew.bat "$PROJECT_DIR/android/"
          cp gradle/wrapper/gradle-wrapper.jar "$PROJECT_DIR/android/gradle/wrapper/"
          cp gradle/wrapper/gradle-wrapper.properties "$PROJECT_DIR/android/gradle/wrapper/"

          chmod +x "$PROJECT_DIR/android/gradlew"

          cd "$PROJECT_DIR/android"
          ./gradlew --version

      - name: Update Android Gradle Plugin and Kotlin
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"]) / "android"

          files = [
              root / "settings.gradle",
              root / "settings.gradle.kts",
              root / "build.gradle",
              root / "build.gradle.kts",
          ]

          agp_updated = False

          for file in files:
              if not file.exists():
                  continue

              content = file.read_text()

              content, count = re.subn(
                  r'((?:id\s*\(?\s*["\']com\.android\.(?:application|library)["\']\s*\)?\s*version\s*)["\'])[^"\']+(["\'])',
                  r'\g<1>9.1.1\g<2>',
                  content
              )
              agp_updated |= count > 0

              content, count = re.subn(
                  r'(com\.android\.tools\.build:gradle:)[0-9.]+',
                  r'\g<1>9.1.1',
                  content
              )
              agp_updated |= count > 0

              content = re.sub(
                  r'((?:id\s*\(?\s*["\']org\.jetbrains\.kotlin\.android["\']\s*\)?\s*version\s*)["\'])[^"\']+(["\'])',
                  r'\g<1>2.2.10\g<2>',
                  content
              )

              content = re.sub(
                  r'(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)[0-9.]+',
                  r'\g<1>2.2.10',
                  content
              )

              file.write_text(content)

          if not agp_updated:
              raise SystemExit("Could not find Android Gradle Plugin version")

          print("Android Gradle Plugin updated to 9.1.1")
          PY

      - name: Remove obsolete Gradle properties
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])

          for file in project.rglob("gradle.properties"):
              content = file.read_text()

              updated = re.sub(
                  r"(?m)^\s*android\.defaults\.buildfeatures\.buildconfig\s*=.*(?:\r?\n|$)",
                  "",
                  content
              )

              if updated != content:
                  file.write_text(updated)
                  print(f"Removed obsolete property from: {file}")

          print("Gradle properties checked")
          PY

      - name: Get Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK file was not generated"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
