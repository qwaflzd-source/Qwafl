
name: Flutter APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install unzip
      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      # 3. Extract ZIP into temporary directory
      - name: Extract Flutter project
        run: |
          mkdir -p "$RUNNER_TEMP/flutter_source"

          unzip -q Flutter-App-Full-SourceCode.zip \
            -d "$RUNNER_TEMP/flutter_source"

          echo "ZIP contents:"
          find "$RUNNER_TEMP/flutter_source" -maxdepth 3 -type f | head -100

          echo "Searching for pubspec.yaml..."

          PUBSPEC=$(find "$RUNNER_TEMP/flutter_source" \
            -name pubspec.yaml \
            -type f \
            -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found at: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 4. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 5. Verify Flutter
      - name: Check Flutter version
        run: |
          flutter --version
          flutter doctor -v

      # 6. Install dependencies
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # 7. Build release APK
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      # 8. Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
