
name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip

      - name: Extract Flutter project
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/flutter_source"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -name "Flutter-App-Full-SourceCode.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Flutter-App-Full-SourceCode.zip not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/flutter_source"

          PROJECT_DIR=$(find "$RUNNER_TEMP/flutter_source" -type f -name pubspec.yaml -printf '%h\n' | while read dir; do
            if [ -d "$dir/lib" ] && [ -d "$dir/android" ]; then
              echo "$dir"
              break
            fi
          done)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Flutter project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Java for Flutter
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          flutter --version
          java -version

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Generate Gradle Wrapper 9.3.1
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP"

          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip

          mkdir -p "$RUNNER_TEMP/wrapper_project"
          cd "$RUNNER_TEMP/wrapper_project"

          echo "rootProject.name = 'wrapper_project'" > settings.gradle

          "$RUNNER_TEMP/gradle-9.3.1/bin/gradle" wrapper --gradle-version 9.3.1

          mkdir -p "$PROJECT_DIR/android/gradle/wrapper"

          cp gradlew "$PROJECT_DIR/android/"
          cp gradlew.bat "$PROJECT_DIR/android/"
          cp gradle/wrapper/* "$PROJECT_DIR/android/gradle/wrapper/"

          chmod +x "$PROJECT_DIR/android/gradlew"

          cd "$PROJECT_DIR/android"
          ./gradlew --version

      - name: Update Android Gradle and Kotlin versions
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path(__import__('os').environ['PROJECT_DIR']) / 'android'

          files = list(root.rglob('*.gradle')) + list(root.rglob('*.gradle.kts'))

          for file in files:
              text = file.read_text()

              text = re.sub(
                  r'(com\.android\.application["\']?\s*version\s*["\']?)[0-9.]+',
                  r'\g<1>9.1.1',
                  text
              )

              text = re.sub(
                  r'(com\.android\.library["\']?\s*version\s*["\']?)[0-9.]+',
                  r'\g<1>9.1.1',
                  text
              )

              text = re.sub(
                  r'com\.android\.tools\.build:gradle:[0-9.]+',
                  'com.android.tools.build:gradle:9.1.1',
                  text
              )

              text = re.sub(
                  r'(org\.jetbrains\.kotlin\.android["\']?\s*version\s*["\']?)[0-9.]+',
                  r'\g<1>2.2.10',
                  text
              )

              text = re.sub(
                  r'org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9.]+',
                  'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10',
                  text
              )

              file.write_text(text)

          print("Gradle and Kotlin versions updated.")
          PY

      - name: Fix Gradle properties and compileSdk
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re
          import os

          root = Path(os.environ['PROJECT_DIR']) / 'android'

          # Update compileSdk to 36 in all Android Gradle files.
          files = list(root.rglob('*.gradle')) + list(root.rglob('*.gradle.kts'))

          for file in files:
              text = file.read_text()

              replacements = [
                  (r'compileSdkVersion\s*=\s*[^\s;]+', 'compileSdkVersion = 36'),
                  (r'compileSdkVersion\s+[^\s;]+', 'compileSdkVersion 36'),
                  (r'compileSdk\s*=\s*[^\s;]+', 'compileSdk = 36'),
                  (r'compileSdk\s+[^\s;]+', 'compileSdk 36'),
              ]

              for pattern, replacement in replacements:
                  text = re.sub(pattern, replacement, text)

              file.write_text(text)

          # Remove obsolete Gradle properties.
          for file in root.rglob('gradle.properties'):
              lines = file.read_text().splitlines()

              lines = [
                  line for line in lines
                  if not line.strip().startswith(
                      'android.defaults.buildfeatures.buildconfig='
                  )
                  and not line.strip().startswith(
                      'android.r8.optimizedResourceShrinking='
                  )
              ]

              lines.append('android.r8.optimizedResourceShrinking=false')

              file.write_text('\n'.join(lines) + '\n')

          print("compileSdk updated to 36.")
          PY

      - name: Update page_transition dependency
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub add page_transition:^2.2.2

      - name: Get Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      - name: Fix InAppWebView ProGuard compatibility
        shell: bash
        run: |
          set -e

          find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/flutter_inappwebview_android-*/android/build.gradle" \
            -type f -print0 |
          while IFS= read -r -d '' file; do
            sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' "$file"
          done

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
