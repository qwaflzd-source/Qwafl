
name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip

      - name: Extract Flutter project
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/flutter_source"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 2 \
            -name "Flutter-App-Full-SourceCode.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Flutter-App-Full-SourceCode.zip not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/flutter_source"

          PROJECT_DIR=$(find "$RUNNER_TEMP/flutter_source" \
            -type f -name pubspec.yaml -printf '%h\n' |
            while read dir; do
              if [ -d "$dir/lib" ] && [ -d "$dir/android" ]; then
                echo "$dir"
                break
              fi
            done)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Flutter project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Java
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          flutter --version
          java -version

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Generate Gradle Wrapper 9.3.1
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP"

          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip

          mkdir -p "$RUNNER_TEMP/wrapper_project"
          cd "$RUNNER_TEMP/wrapper_project"

          echo "rootProject.name = 'wrapper_project'" > settings.gradle

          "$RUNNER_TEMP/gradle-9.3.1/bin/gradle" wrapper \
            --gradle-version 9.3.1

          mkdir -p "$PROJECT_DIR/android/gradle/wrapper"

          cp gradlew "$PROJECT_DIR/android/"
          cp gradlew.bat "$PROJECT_DIR/android/"
          cp gradle/wrapper/* "$PROJECT_DIR/android/gradle/wrapper/"

          chmod +x "$PROJECT_DIR/android/gradlew"

      - name: Fix Android Gradle Plugin and Kotlin versions
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ['PROJECT_DIR']) / 'android'

          extensions = {'.gradle', '.kts', '.toml'}
          files = [p for p in root.rglob('*') if p.is_file() and p.suffix in extensions]

          agp_patterns = [
              (
                  r'(id\s*\(?\s*["\']com\.android\.(?:application|library)["\']\s*\)?\s*version\s*["\'])[0-9.]+(["\'])',
                  r'\g<1>9.1.1\2'
              ),
              (
                  r'(com\.android\.tools\.build:gradle:)[0-9.]+',
                  r'\g<1>9.1.1'
              ),
              (
                  r'(\bagp\s*=\s*["\'])[0-9.]+(["\'])',
                  r'\g<1>9.1.1\2'
              )
          ]

          kotlin_patterns = [
              (
                  r'(id\s*\(?\s*["\']org\.jetbrains\.kotlin\.android["\']\s*\)?\s*version\s*["\'])[0-9.]+(["\'])',
                  r'\g<1>2.2.10\2'
              ),
              (
                  r'(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)[0-9.]+',
                  r'\g<1>2.2.10'
              ),
              (
                  r'(\bkotlin\s*=\s*["\'])[0-9.]+(["\'])',
                  r'\g<1>2.2.10\2'
              )
          ]

          for file in files:
              text = file.read_text()
              original = text

              for pattern, replacement in agp_patterns + kotlin_patterns:
                  text = re.sub(pattern, replacement, text)

              if text != original:
                  file.write_text(text)
                  print("Updated:", file)

          settings = root / 'settings.gradle'
          if settings.exists():
              print("\n--- settings.gradle ---")
              print(settings.read_text())

          print("\nAGP/Kotlin update completed.")
          PY

      - name: Verify Android Gradle Plugin version
        shell: bash
        run: |
          set -e

          if grep -R -nE \
            'com.android.application.*8\.6\.0|com.android.tools.build:gradle:8\.6\.0' \
            "$PROJECT_DIR/android" \
            --include='*.gradle' \
            --include='*.kts' \
            --include='*.toml'; then
            echo "Old AGP 8.6.0 reference still exists."
            exit 1
          fi

          echo "Checking Android Gradle configuration..."

      - name: Set compileSdk to 36
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          app = Path(os.environ['PROJECT_DIR']) / 'android/app/build.gradle'

          if not app.exists():
              app = Path(os.environ['PROJECT_DIR']) / 'android/app/build.gradle.kts'

          if not app.exists():
              raise SystemExit("App Gradle file not found")

          text = app.read_text()

          if app.suffix == '.kts':
              replacement = 'compileSdk = 36'
          else:
              replacement = 'compileSdkVersion 36'

          pattern = r'^(\s*)compileSdk(?:Version)?\s*(?:=\s*)?.*$'

          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + replacement,
              text,
              count=1,
              flags=re.MULTILINE
          )

          if count == 0:
              match = re.search(r'(?m)^(\s*)android\s*\{', text)
              if not match:
                  raise SystemExit("Could not find android block")

              pos = match.end()
              updated = text[:pos] + '\n    ' + replacement + text[pos:]

          app.write_text(updated)

          print("compileSdk set to 36.")
          PY

      - name: Fix Gradle properties
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ['PROJECT_DIR']) / 'android'

          for file in root.rglob('gradle.properties'):
              lines = file.read_text().splitlines()

              lines = [
                  line for line in lines
                  if not line.strip().startswith(
                      'android.defaults.buildfeatures.buildconfig='
                  )
                  and not line.strip().startswith(
                      'android.r8.optimizedResourceShrinking='
                  )
              ]

              lines.append('android.r8.optimizedResourceShrinking=false')

              file.write_text('\n'.join(lines) + '\n')
          PY

      - name: Update page_transition
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub add page_transition:^2.2.2

      - name: Get Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      - name: Fix InAppWebView ProGuard
        shell: bash
        run: |
          set -e

          find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/flutter_inappwebview_android-*/android/build.gradle" \
            -type f -print0 |
          while IFS= read -r -d '' file; do
            sed -i \
              's/proguard-android\.txt/proguard-android-optimize.txt/g' \
              "$file"
          done

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
