
name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Extract ZIP and find Flutter project
      - name: Extract Flutter Source
        run: |
          sudo apt-get install -y -qq unzip

          ZIP_FILE="$GITHUB_WORKSPACE/Flutter-App-Full-SourceCode.zip"
          EXTRACT_DIR="$RUNNER_TEMP/flutter_source"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          mkdir -p "$EXTRACT_DIR"

          unzip -oq "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "Searching for pubspec.yaml..."

          PUBSPEC=$(find "$EXTRACT_DIR" \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/.dart_tool/*" \
            -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found anywhere in ZIP!"
            find "$EXTRACT_DIR" -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          if [ ! -d "$PROJECT_DIR/lib" ]; then
            echo "ERROR: lib directory missing!"
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: android directory missing!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project found successfully!"
          echo "Project path: $PROJECT_DIR"

      # 4. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 5. Verify environment
      - name: Verify Environment
        run: |
          java -version
          flutter --version
          cd "$PROJECT_DIR/android"
          ./gradlew --version

      # 6. Install dependencies
      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # 7. Build APK
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      # 8. Verify APK
      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated!"
            find "$PROJECT_DIR/build" -name "*.apk" || true
            exit 1
          fi

          ls -lh "$APK"

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
