
name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Extract ZIP
      - name: Extract Flutter Source
        shell: bash
        run: |
          sudo apt-get install -y -qq unzip

          ZIP_FILE="$GITHUB_WORKSPACE/Flutter-App-Full-SourceCode.zip"
          EXTRACT_DIR="$RUNNER_TEMP/flutter_source"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          mkdir -p "$EXTRACT_DIR"

          if ! unzip -tq "$ZIP_FILE" > /dev/null; then
            echo "ERROR: ZIP file is corrupted!"
            exit 1
          fi

          unzip -oq "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "ZIP extracted successfully."

          echo "Searching project files..."

          find "$EXTRACT_DIR" -maxdepth 4 -print

          PROJECT_DIR=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"

            if [ -d "$DIR/lib" ] && [ -d "$DIR/android" ]; then
              PROJECT_DIR="$DIR"

              if [ -f "$DIR/android/gradlew" ]; then
                break
              fi
            fi
          done < <(find "$EXTRACT_DIR" -type f -name "pubspec.yaml" -print0)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project not found!"
            echo "Checking extracted files:"
            find "$EXTRACT_DIR" -maxdepth 6 -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "================================"
          echo "PROJECT FOUND:"
          echo "$PROJECT_DIR"
          echo "================================"

          ls -la "$PROJECT_DIR"

          if [ -f "$PROJECT_DIR/android/gradlew" ]; then
            chmod +x "$PROJECT_DIR/android/gradlew"
            echo "Gradle wrapper found."
          else
            echo "WARNING: Gradle wrapper is missing."
          fi

      # 4. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 5. Verify Environment
      - name: Verify Environment
        run: |
          echo "Java version:"
          java -version

          echo "Flutter version:"
          flutter --version

          echo "Project directory:"
          echo "$PROJECT_DIR"

      # 6. Install Dependencies
      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # 7. Build Release APK
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      # 8. Verify APK
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated!"
            find build -name "*.apk"
            exit 1
          fi

          echo "APK generated successfully!"
          ls -lh "$APK"

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
