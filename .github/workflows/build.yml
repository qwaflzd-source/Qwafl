
name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Flutter project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name "Flutter-App-Full-SourceCode.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Flutter-App-Full-SourceCode.zip not found."
            exit 1
          fi

          mkdir -p /home/runner/work/_temp/flutter_source
          unzip -q "$ZIP_FILE" -d /home/runner/work/_temp/flutter_source

          PROJECT_DIR=$(find /home/runner/work/_temp/flutter_source -type f -name pubspec.yaml -printf '%h\n' | while read dir; do
            if [ -d "$dir/lib" ] && [ -d "$dir/android" ]; then
              echo "$dir"
              break
            fi
          done)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not locate Flutter project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Create Gradle wrapper
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/gradle-wrapper
          cd /tmp/gradle-wrapper

          gradle wrapper --gradle-version 9.3.1

          cp gradlew "$PROJECT_DIR/android/gradlew"
          cp -r gradle "$PROJECT_DIR/android/"
          chmod +x "$PROJECT_DIR/android/gradlew"

      - name: Update Android Gradle configuration
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR/android"

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          files = list(root.glob("settings.gradle")) + list(root.glob("settings.gradle.kts"))
          files += list(root.glob("build.gradle")) + list(root.glob("build.gradle.kts"))

          for path in files:
              text = path.read_text()

              text = re.sub(
                  r'(com\.android\.application["\']?\s+version\s+["\'])[^"\']+',
                  r'\g<1>9.1.1',
                  text
              )

              text = re.sub(
                  r'(com\.android\.tools\.build:gradle:)[0-9.]+(?:\.[0-9]+)*',
                  r'\g<1>9.1.1',
                  text
              )

              text = re.sub(
                  r'(org\.jetbrains\.kotlin\.android["\']?\s+version\s+["\'])[^"\']+',
                  r'\g<1>2.2.10',
                  text
              )

              text = re.sub(
                  r'(ext\.kotlin_version\s*=\s*["\'])[^"\']+',
                  r'\g<1>2.2.10',
                  text
              )

              path.write_text(text)

          print("Android Gradle configuration updated.")
          PY

      - name: Align Firebase package with Android application ID
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          firebase_file = Path("android/app/google-services.json")
          gradle_file = Path("android/app/build.gradle")

          if not firebase_file.exists():
              raise SystemExit(
                  "ERROR: android/app/google-services.json is missing."
              )

          data = json.loads(firebase_file.read_text())

          packages = []
          for client in data.get("client", []):
              package_name = (
                  client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )
              if package_name and package_name not in packages:
                  packages.append(package_name)

          if not packages:
              raise SystemExit(
                  "ERROR: No Android package_name found in google-services.json."
              )

          text = gradle_file.read_text()

          match = re.search(
              r'applicationId\s*(?:=\s*)?["\']([^"\']+)["\']',
              text
          )

          current_id = match.group(1) if match else None

          if current_id in packages:
              selected = current_id
          else:
              selected = packages[0]

          if match:
              text = re.sub(
                  r'(applicationId\s*(?:=\s*)?)["\'][^"\']+["\']',
                  lambda m: m.group(1) + '"' + selected + '"',
                  text,
                  count=1
              )
          else:
              text, count = re.subn(
                  r'(defaultConfig\s*\{)',
                  r'\1\n        applicationId "' + selected + '"',
                  text,
                  count=1
              )
              if count == 0:
                  raise SystemExit(
                      "ERROR: Could not find defaultConfig in app/build.gradle."
                  )

          gradle_file.write_text(text)

          print("Firebase Android package names:", packages)
          print("Previous applicationId:", current_id)
          print("Selected applicationId:", selected)
          PY

      - name: Update dependencies
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          flutter pub add page_transition:^2.2.2
          flutter pub add flutter_downloader:^1.12.1
          flutter pub get

      - name: Fix Android plugin compatibility
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path("/home/runner/.pub-cache/hosted/pub.dev"),
              Path("/home/runner/work/_temp/flutter_source")
          ]

          for root in roots:
              if not root.exists():
                  continue

              for path in root.rglob("*.gradle"):
                  try:
                      text = path.read_text()
                  except Exception:
                      continue

                  updated = re.sub(
                      r'compileSdkVersion\s+33\b',
                      'compileSdkVersion 36',
                      text
                  )
                  updated = re.sub(
                      r'compileSdk\s*=\s*33\b',
                      'compileSdk = 36',
                      updated
                  )
                  updated = re.sub(
                      r'compileSdk\s+33\b',
                      'compileSdk 36',
                      updated
                  )

                  if updated != text:
                      path.write_text(updated)

              for path in root.rglob("proguard-android.txt"):
                  try:
                      text = path.read_text()
                      if "proguard-android" in str(path):
                          path.write_text(text)
                  except Exception:
                      pass

          print("Plugin compatibility adjustments completed.")
          PY

          find /home/runner/.pub-cache/hosted/pub.dev \
            -type f -name "*.gradle" -exec sed -i \
            's/proguard-android\.txt/proguard-android-optimize.txt/g' {} +

      - name: Configure R8
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          touch android/gradle.properties

          if ! grep -q "android.r8.optimizedResourceShrinking" android/gradle.properties; then
            echo "android.r8.optimizedResourceShrinking=false" >> android/gradle.properties
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          flutter clean
          flutter pub get
          flutter build apk --debug --verbose

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Debug-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
