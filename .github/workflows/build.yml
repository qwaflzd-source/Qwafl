
name: Build Qawafil APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      # Do not add the deprecated "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      # 4. Flutter 3.35.4 (project version)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          java -version
          flutter --version
          dart --version
          sdkmanager --version

      # 5. Extract the source ZIP
      - name: Extract Flutter source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -name 'Flutter-App-Full-SourceCode.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Flutter-App-Full-SourceCode.zip was not found."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/flutter_source"

          unzip -q "$ZIP_FILE" \
            -d "$RUNNER_TEMP/flutter_source" \
            -x '*/.cxx/*' \
               '*/.dart_tool/*' \
               '*/build/*' \
               '*/.gradle/*'

          PROJECT_DIR="$RUNNER_TEMP/flutter_source/Flutter-App-Full-SourceCode"

          if [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "::error::pubspec.yaml was not found in the extracted project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 6. Align Android package with Firebase configuration
      - name: Configure Android package and MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path.cwd()
          gradle_file = root / "android/app/build.gradle"
          firebase_file = root / "android/app/google-services.json"

          if not gradle_file.is_file():
              raise SystemExit("android/app/build.gradle is missing")

          if not firebase_file.is_file():
              raise SystemExit("android/app/google-services.json is missing")

          data = json.loads(firebase_file.read_text(encoding="utf-8"))

          clients = data.get("client", [])
          packages = []

          for client in clients:
              package = (
                  client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )
              if package:
                  packages.append(package)

          if not packages:
              raise SystemExit(
                  "No Android package_name was found in google-services.json"
              )

          # Keep the custom package if Firebase already has it.
          # Otherwise use the first package registered in Firebase.
          package = (
              "com.qwafily.app"
              if "com.qwafily.app" in packages
              else packages[0]
          )

          if not re.fullmatch(
              r"[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)+",
              package
          ):
              raise SystemExit(f"Invalid Android package name: {package}")

          text = gradle_file.read_text(encoding="utf-8")

          text, namespace_count = re.subn(
              r'(?m)^(\s*namespace\s*=\s*)["\'][^"\']+["\']',
              lambda m: m.group(1) + f'"{package}"',
              text,
              count=1
          )

          text, appid_count = re.subn(
              r'(?m)^(\s*applicationId\s*=\s*)["\'][^"\']+["\']',
              lambda m: m.group(1) + f'"{package}"',
              text,
              count=1
          )

          if namespace_count != 1:
              raise SystemExit("Could not safely update Android namespace")

          if appid_count != 1:
              raise SystemExit("Could not safely update applicationId")

          gradle_file.write_text(text, encoding="utf-8")

          # Remove old MainActivity files to prevent duplicate classes.
          source_dir = root / "android/app/src/main"

          for path in source_dir.rglob("*"):
              if path.is_file() and path.name in (
                  "MainActivity.kt",
                  "MainActivity.java"
              ):
                  path.unlink()

          # Recreate MainActivity in the correct namespace path.
          package_path = package.replace(".", "/")
          activity_dir = (
              root / "android/app/src/main/kotlin" / package_path
          )
          activity_dir.mkdir(parents=True, exist_ok=True)

          activity_file = activity_dir / "MainActivity.kt"
          activity_file.write_text(
              f"""package {package}

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          """,
              encoding="utf-8"
          )

          print(f"Android namespace: {package}")
          print(f"Android applicationId: {package}")
          print(f"MainActivity: {activity_file}")
          PY

      # 7. Configure compatible Android Gradle Plugin
      - name: Configure Android Gradle Plugin
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          import re
          from pathlib import Path

          settings = Path("android/settings.gradle")

          if not settings.is_file():
              raise SystemExit("android/settings.gradle is missing")

          text = settings.read_text(encoding="utf-8")

          pattern = (
              r'(id\s+["\']com\.android\.application["\']'
              r'\s+version\s+["\'])[^"\']+(["\'])'
          )

          updated, count = re.subn(
              pattern,
              r'\g<1>8.10.1\g<2>',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "Could not find Android application plugin version "
                  "in settings.gradle"
              )

          settings.write_text(updated, encoding="utf-8")
          print("Android Gradle Plugin set to 8.10.1")
          PY

      # 8. Set up Gradle 8.11.1
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 9. Generate missing Gradle wrapper
      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
          FLUTTER_ROOT="$(dirname "$(dirname "$FLUTTER_BIN")")"

          mkdir -p android

          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "flutter.sdk=$FLUTTER_ROOT"
          } > android/local.properties

          cd android

          gradle wrapper \
            --gradle-version 8.11.1 \
            --distribution-type all

          chmod +x gradlew

          ./gradlew --version

          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradlew

      # 10. Update downloader dependency
      - name: Resolve Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub add "flutter_downloader:^1.12.1"
          flutter pub get

      # 11. Fix obsolete ProGuard reference in InAppWebView
      - name: Fix InAppWebView ProGuard configuration
        shell: bash
        run: |
          set -euo pipefail

          PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"

          find "$PUB_CACHE" \
            -type f \
            -path '*flutter_inappwebview_android*' \
            -name '*.gradle' \
            -print0 |
          while IFS= read -r -d '' file; do
            sed -i \
              's/proguard-android\.txt/proguard-android-optimize.txt/g' \
              "$file"
          done

      # 12. Clean stale generated files
      - name: Clean Flutter project
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter clean
          flutter pub get

      # 13. Build debug APK
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./android/gradlew \
            -p android \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            assembleDebug

          APK="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK output was not generated."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/qawafil_output"
          cp "$APK" "$RUNNER_TEMP/qawafil_output/Qawafil-Debug.apk"

          ls -lh "$RUNNER_TEMP/qawafil_output/Qawafil-Debug.apk"

      # 14. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qawafil-Debug-APK
          path: ${{ runner.temp }}/qawafil_output/Qawafil-Debug.apk
          if-no-files-found: error
          retention-days: 14
