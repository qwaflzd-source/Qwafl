
name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Extract ZIP and locate project
      - name: Extract Flutter Source
        shell: bash
        run: |
          sudo apt-get install -y -qq unzip

          ZIP_FILE="$GITHUB_WORKSPACE/Flutter-App-Full-SourceCode.zip"
          EXTRACT_DIR="$RUNNER_TEMP/flutter_source"

          echo "Checking ZIP file..."

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file does not exist!"
            exit 1
          fi

          echo "Checking ZIP integrity..."

          if ! unzip -tq "$ZIP_FILE" > /dev/null; then
            echo "ERROR: ZIP file is invalid or corrupted!"
            exit 1
          fi

          echo "Extracting project..."

          mkdir -p "$EXTRACT_DIR"

          if ! unzip -oq "$ZIP_FILE" -d "$EXTRACT_DIR"; then
            echo "ERROR: Extraction failed!"
            exit 1
          fi

          echo "Extraction completed."

          # Find pubspec.yaml files
          find "$EXTRACT_DIR" -type f -name "pubspec.yaml" \
            -print0 > "$RUNNER_TEMP/pubspec_list"

          PROJECT_DIR=""

          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"

            if [ -d "$DIR/lib" ] && \
               [ -f "$DIR/android/gradlew" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < "$RUNNER_TEMP/pubspec_list"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project not found!"
            echo "Expected pubspec.yaml, lib and android/gradlew."
            echo "Extracted directory: $EXTRACT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "================================"
          echo "Flutter project successfully found"
          echo "Project: $PROJECT_DIR"
          echo "================================"

          ls -la "$PROJECT_DIR"

      # 4. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 5. Verify environment
      - name: Verify Environment
        shell: bash
        run: |
          java -version
          flutter --version

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew --version

      # 6. Install dependencies
      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # 7. Build APK
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      # 8. Verify APK
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not generated!"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # 9. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
