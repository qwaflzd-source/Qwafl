
name: Build Qawafil APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 4 -type f \
            -name 'Flutter-App-Full-SourceCode.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/flutter_source"

          unzip -q "$ZIP_FILE" \
            -d "$RUNNER_TEMP/flutter_source" \
            -x '*/.cxx/*' '*/.dart_tool/*' '*/build/*' '*/.gradle/*'

          PROJECT_DIR="$RUNNER_TEMP/flutter_source/Flutter-App-Full-SourceCode"

          if [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "::error::pubspec.yaml not found in expected project directory"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validate Android and Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          firebase = Path("android/app/google-services.json")
          settings = Path("android/settings.gradle")
          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")

          for p in (gradle, firebase, settings, wrapper):
              if not p.is_file():
                  raise SystemExit(f"Required file missing: {p}")

          text = gradle.read_text(encoding="utf-8")

          def read_value(name):
              matches = re.findall(
                  rf'(?m)^\s*{name}\s*=\s*["\']([^"\']+)["\']',
                  text
              )
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one {name} declaration"
                  )
              return matches[0]

          namespace = read_value("namespace")
          application_id = read_value("applicationId")

          if namespace != "com.qwafily.app":
              raise SystemExit(f"Unexpected namespace: {namespace}")

          if application_id != "com.qwafily.app":
              raise SystemExit(
                  f"Unexpected applicationId: {application_id}"
              )

          data = json.loads(firebase.read_text(encoding="utf-8"))

          packages = [
              client.get("client_info", {})
                    .get("android_client_info", {})
                    .get("package_name")
              for client in data.get("client", [])
          ]

          if application_id not in packages:
              raise SystemExit(
                  "Firebase package does not match applicationId"
              )

          wrapper_text = wrapper.read_text(encoding="utf-8")

          if "gradle-8.7-all.zip" not in wrapper_text:
              raise SystemExit(
                  "Project Gradle wrapper properties do not specify Gradle 8.7"
              )

          print("Android namespace:", namespace)
          print("Application ID:", application_id)
          print("Firebase package: verified")
          print("Gradle wrapper version: 8.7")
          PY

      - name: Align MainActivity with application namespace
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          import re
          from pathlib import Path

          src = Path("android/app/src/main")

          files = list(src.rglob("MainActivity.kt"))
          files += list(src.rglob("MainActivity.java"))

          if len(files) != 1:
              raise SystemExit(
                  f"Expected exactly one MainActivity file, found {len(files)}"
              )

          old = files[0]
          is_kotlin = old.suffix == ".kt"

          if is_kotlin:
              destination = (
                  src / "kotlin/com/qwafily/app/MainActivity.kt"
              )
              package_line = "package com.qwafily.app"
          else:
              destination = (
                  src / "java/com/qwafily/app/MainActivity.java"
              )
              package_line = "package com.qwafily.app;"

          content = old.read_text(encoding="utf-8")

          pattern = r"(?m)^\s*package\s+[\w.]+\s*;?\s*$"

          if re.search(pattern, content):
              content, count = re.subn(
                  pattern,
                  package_line,
                  content,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not align MainActivity package")
          else:
              content = package_line + "\n\n" + content

          if destination.exists() and destination != old:
              raise SystemExit(
                  f"Destination already exists: {destination}"
              )

          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(content, encoding="utf-8")

          if destination != old:
              old.unlink()

          print("MainActivity aligned:", destination)
          PY

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
          FLUTTER_ROOT="$(dirname "$(dirname "$FLUTTER_BIN")")"

          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "flutter.sdk=$FLUTTER_ROOT"
          } > android/local.properties

          cd android

          gradle wrapper \
            --gradle-version 8.7 \
            --distribution-type all

          chmod +x gradlew

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          ./gradlew --version

      - name: Restore Debug Keystore
        shell: bash
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ -n "${DEBUG_KEYSTORE_B64:-}" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" \
              | base64 --decode > "$HOME/.android/debug.keystore"

            keytool -list \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey >/dev/null

            echo "Permanent debug keystore restored."
          else
            echo "::warning::DEBUG_KEYSTORE_B64 is missing. A temporary debug keystore will be generated."
          fi

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter --version
          flutter clean
          flutter pub get

      - name: Build ARM64 Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter build apk \
            --debug \
            --target-platform android-arm64

          APK="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/qawafil_output"

          cp "$APK" \
            "$RUNNER_TEMP/qawafil_output/Qawafil-ARM64-Debug.apk"

          ls -lh "$RUNNER_TEMP/qawafil_output/Qawafil-ARM64-Debug.apk"

      - name: Print Debug APK SHA-1
        shell: bash
        run: |
          set -euo pipefail

          APK="$RUNNER_TEMP/qawafil_output/Qawafil-ARM64-Debug.apk"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK" \
            | grep -i "SHA-1 digest:"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qawafil-ARM64-Debug-APK
          path: ${{ runner.temp }}/qawafil_output/Qawafil-ARM64-Debug.apk
          if-no-files-found: error
          retention-days: 14
