
name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip

      - name: Extract Flutter project
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/flutter_source"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 2 \
            -name "Flutter-App-Full-SourceCode.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Flutter-App-Full-SourceCode.zip not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/flutter_source"

          PROJECT_DIR=$(find "$RUNNER_TEMP/flutter_source" \
            -type f -name pubspec.yaml -printf '%h\n' |
            while read dir; do
              if [ -d "$dir/lib" ] && [ -d "$dir/android" ]; then
                echo "$dir"
                break
              fi
            done)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Flutter project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Java
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          flutter --version
          java -version

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Generate Gradle Wrapper 9.3.1
        shell: bash
        run: |
          set -e
          cd "$RUNNER_TEMP"

          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip

          mkdir -p "$RUNNER_TEMP/wrapper_project"
          cd "$RUNNER_TEMP/wrapper_project"

          echo "rootProject.name = 'wrapper_project'" > settings.gradle

          "$RUNNER_TEMP/gradle-9.3.1/bin/gradle" wrapper \
            --gradle-version 9.3.1

          mkdir -p "$PROJECT_DIR/android/gradle/wrapper"

          cp gradlew "$PROJECT_DIR/android/"
          cp gradlew.bat "$PROJECT_DIR/android/"
          cp gradle/wrapper/* "$PROJECT_DIR/android/gradle/wrapper/"

          chmod +x "$PROJECT_DIR/android/gradlew"

      - name: Update Android Gradle Plugin and Kotlin
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ['PROJECT_DIR']) / 'android'

          extensions = {'.gradle', '.kts', '.toml'}

          for file in root.rglob('*'):
              if not file.is_file() or file.suffix not in extensions:
                  continue

              text = file.read_text()
              original = text

              # Android Gradle Plugin versions in plugins blocks.
              text = re.sub(
                  r'(com\.android\.(?:application|library)\s*["\']?\s*version\s*["\']?)[0-9.]+',
                  r'\g<1>9.1.1',
                  text
              )

              # Older buildscript classpath format.
              text = re.sub(
                  r'(com\.android\.tools\.build:gradle:)[0-9.]+',
                  r'\g<1>9.1.1',
                  text
              )

              # Version catalog AGP entries.
              text = re.sub(
                  r'(\bagp\s*=\s*["\'])[0-9.]+(["\'])',
                  r'\g<1>9.1.1\2',
                  text
              )

              # Kotlin plugin versions.
              text = re.sub(
                  r'(org\.jetbrains\.kotlin\.android\s*["\']?\s*version\s*["\']?)[0-9.]+',
                  r'\g<1>2.2.10',
                  text
              )

              text = re.sub(
                  r'(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)[0-9.]+',
                  r'\g<1>2.2.10',
                  text
              )

              if text != original:
                  file.write_text(text)
                  print("Updated:", file)

          PY

      - name: Update Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub add page_transition:^2.2.2
          flutter pub get

      - name: Set compileSdk 36 in all Android modules
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          project = Path(os.environ['PROJECT_DIR'])
          roots = [
              project / 'android',
              Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          ]

          changed = 0

          for root in roots:
              if not root.exists():
                  continue

              for file in root.rglob('*'):
                  if not file.is_file():
                      continue

                  if file.name not in ('build.gradle', 'build.gradle.kts'):
                      continue

                  try:
                      text = file.read_text()
                  except Exception:
                      continue

                  original = text

                  if file.suffix == '.kts':
                      replacement = 'compileSdk = 36'
                  else:
                      replacement = 'compileSdkVersion 36'

                  pattern = (
                      r'^(\s*)compileSdk(?:Version)?'
                      r'\s*(?:=\s*)?.*$'
                  )

                  text, count = re.subn(
                      pattern,
                      lambda m: m.group(1) + replacement,
                      text,
                      flags=re.MULTILINE
                  )

                  if count:
                      file.write_text(text)
                      changed += 1
                      print("Updated compileSdk:", file)

          print(f"Updated {changed} Gradle files.")

          if changed == 0:
              raise SystemExit("No compileSdk declarations were updated.")
          PY

      - name: Fix Gradle properties
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ['PROJECT_DIR']) / 'android'

          for file in root.rglob('gradle.properties'):
              lines = file.read_text().splitlines()

              lines = [
                  line for line in lines
                  if not line.strip().startswith(
                      'android.defaults.buildfeatures.buildconfig='
                  )
                  and not line.strip().startswith(
                      'android.r8.optimizedResourceShrinking='
                  )
              ]

              lines.append('android.r8.optimizedResourceShrinking=false')
              file.write_text('\n'.join(lines) + '\n')
          PY

      - name: Fix InAppWebView ProGuard
        shell: bash
        run: |
          set -e

          find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/flutter_inappwebview_android-*/android/build.gradle" \
            -type f -print0 |
          while IFS= read -r -d '' file; do
            sed -i \
              's/proguard-android\.txt/proguard-android-optimize.txt/g' \
              "$file"
          done

      - name: Verify Android configuration
        shell: bash
        run: |
          echo "Checking remaining old compileSdk declarations:"
          grep -R -nE 'compileSdk(Version)?[[:space:]]+33' \
            "$PROJECT_DIR/android" \
            "$HOME/.pub-cache/hosted/pub.dev" \
            --include='build.gradle' \
            --include='build.gradle.kts' || true

          echo "Checking AGP references:"
          grep -R -nE 'com.android.application.*version|com.android.tools.build:gradle:' \
            "$PROJECT_DIR/android" \
            --include='settings.gradle' \
            --include='settings.gradle.kts' \
            --include='build.gradle' \
            --include='build.gradle.kts' || true

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Release-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
